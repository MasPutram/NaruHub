name: Deploy NaruHub Monitor

on:
  push:
    branches:
      - main
    paths:
      - "StealAnEgg/monitor/**"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

concurrency:
  group: naruhub-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: StealAnEgg/monitor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: StealAnEgg/monitor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare standalone artifact
        run: |
          rm -rf deploy-artifact
          mkdir -p deploy-artifact/standalone

          cp -a .next/standalone/. deploy-artifact/standalone/

          if [ -d ".next/static" ]; then
            mkdir -p deploy-artifact/standalone/.next/static
            cp -a .next/static/. deploy-artifact/standalone/.next/static/
          fi

          if [ -d "public" ]; then
            mkdir -p deploy-artifact/standalone/public
            cp -a public/. deploy-artifact/standalone/public/
          fi

      - name: Create archive
        run: tar -czf naruhub-monitor.tar.gz -C deploy-artifact .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: naruhub-monitor-${{ github.sha }}
          path: StealAnEgg/monitor/naruhub-monitor.tar.gz
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: naruhub-monitor-${{ github.sha }}

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Write env file
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
        run: |
          cat > dotenv.txt <<ENVEOF
          REDIS_URL=${REDIS_URL}
          AUTH_SECRET=${AUTH_SECRET}
          AUTH_USERNAME=${AUTH_USERNAME}
          AUTH_PASSWORD=${AUTH_PASSWORD}
          PORT=3000
          HOSTNAME=0.0.0.0
          ENVEOF
          sed -i 's/^          //' dotenv.txt
          scp dotenv.txt "${VPS_USER}@${VPS_HOST}:/root/NaruHub/StealAnEgg/monitor/.deploy/.env"
          rm -f dotenv.txt

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          scp naruhub-monitor.tar.gz \
            "${VPS_USER}@${VPS_HOST}:/tmp/naruhub-monitor-${RELEASE_ID}.tar.gz"

          ssh "${VPS_USER}@${VPS_HOST}" \
            "RELEASE_ID='${RELEASE_ID}' bash -s" <<'REMOTE'
          set -euo pipefail

          BASE="/root/NaruHub/StealAnEgg/monitor/.deploy"
          RELEASE="$BASE/releases/$RELEASE_ID"
          ARCHIVE="/tmp/naruhub-monitor-$RELEASE_ID.tar.gz"
          ACTIVE="$BASE/active"

          mkdir -p "$BASE/releases"
          rm -rf "$RELEASE"
          mkdir -p "$RELEASE"

          tar -xzf "$ARCHIVE" -C "$RELEASE"

          # Copy env file into standalone so Node.js picks it up
          if [ -f "$BASE/.env" ]; then
            cp "$BASE/.env" "$RELEASE/standalone/.env"
          fi

          if [ ! -f "$RELEASE/standalone/server.js" ]; then
            echo "FATAL: standalone/server.js not found in release"
            rm -rf "$RELEASE"
            exit 1
          fi

          # --- Resolve previous release and handle active ---
          PREVIOUS=""

          if [ -L "$ACTIVE" ]; then
            # Kondisi A: active is a symlink — read its target
            PREVIOUS="$(readlink -f "$ACTIVE")"
          elif [ -d "$ACTIVE" ]; then
            # Kondisi B: active is a plain directory — remove it
            echo "WARNING: active is a plain directory, removing it"
            rm -rf "$ACTIVE"
          fi
          # Kondisi C: active doesn't exist — PREVIOUS stays empty

          # Atomic symlink swap: create temp symlink then mv (rename is atomic)
          TMPLINK="$BASE/active.new.$$"
          ln -s "$RELEASE" "$TMPLINK"
          mv -T "$TMPLINK" "$ACTIVE"

          # Ensure systemd loads env file
          SVC_FILE="/etc/systemd/system/naruhub-monitor.service"
          if [ -f "$SVC_FILE" ] && ! grep -q "EnvironmentFile=" "$SVC_FILE"; then
            sed -i "/\[Service\]/a EnvironmentFile=$BASE/.env" "$SVC_FILE"
            systemctl daemon-reload
          fi

          # --- Restart and verify ---
          systemctl restart naruhub-monitor
          sleep 3

          HEALTHY=false
          for i in 1 2 3 4 5; do
            if systemctl is-active --quiet naruhub-monitor; then
              HEALTHY=true
              break
            fi
            echo "Waiting for service to start... attempt $i"
            sleep 2
          done

          if [ "$HEALTHY" = true ]; then
            # Health check the HTTP endpoint
            if ! curl -fsS --max-time 10 https://naruhub.my.id/ > /dev/null 2>&1; then
              echo "WARNING: HTTP health check failed, but service is running"
            fi
          fi

          if [ "$HEALTHY" = false ]; then
            echo "ERROR: New release failed to start"
            journalctl -u naruhub-monitor --no-pager -n 30

            if [ -n "$PREVIOUS" ] && [ -d "$PREVIOUS" ] && [ "$PREVIOUS" != "$RELEASE" ]; then
              echo "Rolling back to $PREVIOUS"
              TMPLINK_RB="$BASE/active.rollback.$$"
              ln -s "$PREVIOUS" "$TMPLINK_RB"
              mv -T "$TMPLINK_RB" "$ACTIVE"
              systemctl restart naruhub-monitor
              sleep 2
              if systemctl is-active --quiet naruhub-monitor; then
                echo "Rollback successful"
              else
                echo "Rollback also failed"
              fi
            else
              echo "No previous release available for rollback"
            fi

            rm -f "$ARCHIVE"
            exit 1
          fi

          echo "Deployment successful: $RELEASE_ID"

          # Cleanup: keep last 5 releases
          rm -f "$ARCHIVE"
          cd "$BASE/releases"
          ls -1dt */ 2>/dev/null |
            tail -n +6 |
            while read -r old; do
              OLDPATH="$BASE/releases/$old"
              # Don't delete the currently active or previous release
              if [ "$OLDPATH" != "$RELEASE" ] && [ "$OLDPATH" != "${PREVIOUS%/}" ]; then
                rm -rf "$OLDPATH"
              fi
            done
          REMOTE
