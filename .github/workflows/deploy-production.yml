name: Deploy NaruHub Monitor

on:
  push:
    branches:
      - main
    paths:
      - "monitor/**"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

concurrency:
  group: naruhub-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: monitor

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: monitor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare standalone artifact
        run: |
          rm -rf deploy-artifact
          mkdir -p deploy-artifact/standalone

          cp -a .next/standalone/. deploy-artifact/standalone/

          if [ -d ".next/static" ]; then
            mkdir -p deploy-artifact/standalone/.next/static
            cp -a .next/static/. deploy-artifact/standalone/.next/static/
          fi

          if [ -d "public" ]; then
            mkdir -p deploy-artifact/standalone/public
            cp -a public/. deploy-artifact/standalone/public/
          fi

      - name: Create archive
        run: tar -czf naruhub-monitor.tar.gz -C deploy-artifact .

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: naruhub-monitor-${{ github.sha }}
          path: monitor/naruhub-monitor.tar.gz
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: naruhub-monitor-${{ github.sha }}

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -e
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "ERROR: VPS_SSH_KEY secret is empty. Set it in repo Settings > Secrets > Actions."
            exit 1
          fi
          if [ -z "$VPS_HOST" ]; then
            echo "ERROR: VPS_HOST secret is empty. Set it in repo Settings > Secrets > Actions."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for attempt in 1 2 3 4 5 6 7 8; do
            if ssh-keyscan -T 20 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "ssh-keyscan succeeded on attempt $attempt"
              break
            fi
            echo "ssh-keyscan attempt $attempt failed, retrying in ${attempt}0s..."
            sleep "${attempt}0"
          done
          if [ ! -s ~/.ssh/known_hosts ]; then
            # Fallback: skip host-key verification. Less secure (TOFU/MITM window)
            # but keeps deploys going when the runner IP is being blocked by
            # fail2ban or there is a transient network blip. The actual ssh/scp
            # commands below use IdentitiesOnly + the deploy key, and the VPS
            # verifies our key — so the attack surface is the response path.
            echo "WARN: ssh-keyscan failed after 8 attempts; falling back to StrictHostKeyChecking=no"
            cat >> ~/.ssh/config <<'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          EOF
            chmod 600 ~/.ssh/config
          fi

      - name: Write env file
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          ACCESS_KEYS: ${{ secrets.ACCESS_KEYS }}
        run: |
          cat > dotenv.txt <<ENVEOF
          REDIS_URL=${REDIS_URL}
          AUTH_SECRET=${AUTH_SECRET}
          ACCESS_KEYS=${ACCESS_KEYS}
          PORT=3000
          HOSTNAME=0.0.0.0
          ENVEOF
          sed -i 's/^          //' dotenv.txt
          scp dotenv.txt "${VPS_USER}@${VPS_HOST}:/tmp/naruhub-monitor-dotenv.txt"
          rm -f dotenv.txt

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          scp naruhub-monitor.tar.gz \
            "${VPS_USER}@${VPS_HOST}:/tmp/naruhub-monitor-${RELEASE_ID}.tar.gz"

          ssh "${VPS_USER}@${VPS_HOST}" \
            "RELEASE_ID='${RELEASE_ID}' bash -s" <<'REMOTE'
          set -euo pipefail

          OLD_BASE="/root/NaruHub/StealAnEgg/monitor/.deploy"
          BASE="/root/NaruHub/monitor/.deploy"
          RELEASE="$BASE/releases/$RELEASE_ID"
          ARCHIVE="/tmp/naruhub-monitor-$RELEASE_ID.tar.gz"
          ACTIVE="$BASE/active"

          # --- One-time migration from old path ---
          if [ -d "$OLD_BASE" ] && [ ! -d "$BASE/releases" ]; then
            echo "Migrating deploy dir from old path..."
            mkdir -p "$(dirname "$BASE")"
            cp -a "$OLD_BASE" "$BASE"
            echo "Migration complete: $OLD_BASE -> $BASE"
          fi

          mkdir -p "$BASE/releases"

          # Move env file from temp upload location
          if [ -f /tmp/naruhub-monitor-dotenv.txt ]; then
            mv /tmp/naruhub-monitor-dotenv.txt "$BASE/.env"
          fi

          rm -rf "$RELEASE"
          mkdir -p "$RELEASE"

          tar -xzf "$ARCHIVE" -C "$RELEASE"

          # Copy env file into standalone so Node.js picks it up
          if [ -f "$BASE/.env" ]; then
            cp "$BASE/.env" "$RELEASE/standalone/.env"
          fi

          if [ ! -f "$RELEASE/standalone/server.js" ]; then
            echo "FATAL: standalone/server.js not found in release"
            rm -rf "$RELEASE"
            exit 1
          fi

          # --- Resolve previous release and handle active ---
          PREVIOUS=""

          if [ -L "$ACTIVE" ]; then
            PREVIOUS="$(readlink -f "$ACTIVE")"
          elif [ -d "$ACTIVE" ]; then
            echo "WARNING: active is a plain directory, removing it"
            rm -rf "$ACTIVE"
          fi

          # Atomic symlink swap
          TMPLINK="$BASE/active.new.$$"
          ln -s "$RELEASE" "$TMPLINK"
          mv -T "$TMPLINK" "$ACTIVE"

          # Update systemd service to point to new path
          SVC_FILE="/etc/systemd/system/naruhub-monitor.service"
          if [ -f "$SVC_FILE" ]; then
            # Fix EnvironmentFile if pointing to old path
            if grep -q "StealAnEgg" "$SVC_FILE"; then
              sed -i "s|/root/NaruHub/StealAnEgg/monitor/.deploy|$BASE|g" "$SVC_FILE"
              systemctl daemon-reload
              echo "Updated systemd service paths"
            fi
            # Add EnvironmentFile if missing
            if ! grep -q "EnvironmentFile=" "$SVC_FILE"; then
              sed -i "/\[Service\]/a EnvironmentFile=$BASE/.env" "$SVC_FILE"
              systemctl daemon-reload
            fi
          fi

          # --- Restart and verify ---
          systemctl restart naruhub-monitor
          sleep 3

          HEALTHY=false
          for i in 1 2 3 4 5; do
            if systemctl is-active --quiet naruhub-monitor; then
              HEALTHY=true
              break
            fi
            echo "Waiting for service to start... attempt $i"
            sleep 2
          done

          if [ "$HEALTHY" = true ]; then
            if ! curl -fsS --max-time 10 https://naruhub.my.id/ > /dev/null 2>&1; then
              echo "WARNING: HTTP health check failed, but service is running"
            fi
          fi

          if [ "$HEALTHY" = false ]; then
            echo "ERROR: New release failed to start"
            journalctl -u naruhub-monitor --no-pager -n 30

            if [ -n "$PREVIOUS" ] && [ -d "$PREVIOUS" ] && [ "$PREVIOUS" != "$RELEASE" ]; then
              echo "Rolling back to $PREVIOUS"
              TMPLINK_RB="$BASE/active.rollback.$$"
              ln -s "$PREVIOUS" "$TMPLINK_RB"
              mv -T "$TMPLINK_RB" "$ACTIVE"
              systemctl restart naruhub-monitor
              sleep 2
              if systemctl is-active --quiet naruhub-monitor; then
                echo "Rollback successful"
              else
                echo "Rollback also failed"
              fi
            else
              echo "No previous release available for rollback"
            fi

            rm -f "$ARCHIVE"
            exit 1
          fi

          echo "Deployment successful: $RELEASE_ID"

          # Cleanup: keep last 5 releases
          rm -f "$ARCHIVE"
          cd "$BASE/releases"
          ls -1dt */ 2>/dev/null |
            tail -n +6 |
            while read -r old; do
              OLDPATH="$BASE/releases/$old"
              if [ "$OLDPATH" != "$RELEASE" ] && [ "$OLDPATH" != "${PREVIOUS%/}" ]; then
                rm -rf "$OLDPATH"
              fi
            done
          REMOTE
